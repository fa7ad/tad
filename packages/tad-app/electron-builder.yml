appId: com.fa7ad.tad
asarUnpack:
  - '**/*.node'
  - '**/*reltab*'
# afterSign: ./tools/notarize.js
buildNumber: "1"
directories:
  buildResources: buildRes
dmg:
  icon: dmgIcon.icns
  sign: false
extraResources:
  - tad.sh
  - examples
files:
  - dist/**/*
  - build
  - node_modules
fileAssociations:
  - ext: csv
    name: Comma Separated Values
    role: Viewer
  - ext: tsv
    name: Tab Separated Values
    role: Viewer
  - ext: tad
    name: Tad Saved Workspace
    role: Editor
  - ext: parquet
    name: Parquet files
    role: Viewer
  - ext: sqlite
    name: Sqlite files
    role: Viewer
  - ext: duckdb
    name: DuckDb files
    role: Viewer
  - ext: csv.gz
    name: Compressed CSV files
    role: Viewer
linux:
  target:
    - deb
    - rpm
    - tar.bz2
mac:
  hardenedRuntime: true
  gatekeeperAssess: false
  category: public.app-category.developer-tools
  entitlements: res/entitlements.mac.plist
  entitlementsInherit: res/entitlements.mac.plist
  target:
    - zip
    - dmg
nodeGypRebuild: false
npmRebuild: true
nsis:
  oneClick: false
productName: Tad
